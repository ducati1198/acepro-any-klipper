# ============================================================================
# ACE Pro steps for Simple AF (Pellcorp) hooks
# ============================================================================
# Written by installer.sh ONLY when none of these hook macros exist anywhere in
# your config. If you already have hooks (for example in my_saf_hooks.cfg), the
# installer does not write this file; it shows you which lines to add instead
# (same content as examples/saf_hooks_example.cfg).
#
# Hook docs: https://pellcorp.github.io/creality-wiki/custom_hooks/
# ============================================================================

[gcode_macro _SAF_HOMING_START]
gcode:
    ZERO_OUT_SERVO              # servo out of the way (does nothing if you have no servo)

[gcode_macro _SAF_HOMING_END]
gcode:
    ZERO_OUT_SERVO

[gcode_macro _SAF_BED_MESH_START]
gcode:
    ZERO_OUT_SERVO

[gcode_macro _SAF_START_PRINT_START]
gcode:
    ZERO_OUT_SERVO

[gcode_macro _SAF_START_PRINT_END]
gcode:
    SFS_ENABLE_ACE_ENCODER      # turn the encoder runout check on once the print starts

[gcode_macro _SAF_END_PRINT_START]
gcode:
    SFS_DISABLE_ACE_ENCODER
    ZERO_OUT_SERVO
    {% if printer["output_pin AUTO_UNLOAD"].value %}
        _UNLOAD_TOOL_PRINT
    {% endif %}

[gcode_macro _SAF_ON_CANCEL]
gcode:
    SFS_DISABLE_ACE_ENCODER
    {% if printer["output_pin AUTO_UNLOAD"].value %}
        _UNLOAD_TOOL_PRINT
    {% endif %}
    PARK_FOR_CANCEL

[gcode_macro _SAF_ON_PAUSE]
gcode:
    _ACE_ON_PAUSE               # does nothing when the ACE_Pro switch is off

[gcode_macro _SAF_ON_RESUME]
gcode:
    _ACE_ON_RESUME              # does nothing when the ACE_Pro switch is off
