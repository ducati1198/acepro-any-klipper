# ============================================================================
# Simple AF (Pellcorp) hooks with the ACE Pro steps
# ============================================================================
# Include it from printer.cfg:   [include my_saf_hooks.cfg]
# The installer puts the ACE lines at the TOP of each hook macro (ZERO_OUT_SERVO first, then the
# encoder line). Only in _SAF_END_PRINT_START does ZERO_OUT_SERVO stay below the encoder line,
# before the unload. The hooks for heating the nozzle, cancel and filament runout get NO ZERO_OUT_SERVO.
# If this file already existed, your other lines were left as they are.
#
# Lines ending in "#@TAG" are instructions for installer.sh (it removes them when it writes the file):
#   #@TOP        goes to the top of the macro
#   #@ENCODER    only with the ACE encoder sensor (removed if you have none)
#   #@SERVO      only with the servo poop basket
#   #@IFEXISTS   only added to a macro you already have (the macro is never created for it)
#
# Hook docs: https://pellcorp.github.io/creality-wiki/custom_hooks/
# ============================================================================

[gcode_macro _SAF_HOMING_START]
gcode:
    ZERO_OUT_SERVO              # servo out of the way (does nothing if you have no servo)  #@TOP,SERVO

[gcode_macro _SAF_HOMING_END]
gcode:
    ZERO_OUT_SERVO  #@TOP,SERVO

[gcode_macro _SAF_HEATING_BED_START]
gcode:
    ZERO_OUT_SERVO  #@TOP,SERVO

[gcode_macro _SAF_HEATING_BED_END]
gcode:
    ZERO_OUT_SERVO  #@TOP,SERVO

[gcode_macro _SAF_BED_MESH_START]
gcode:
    ZERO_OUT_SERVO  #@TOP,SERVO

[gcode_macro _SAF_BED_MESH_END]
gcode:
    ZERO_OUT_SERVO  #@TOP,SERVO

[gcode_macro _SAF_START_PRINT_START]
gcode:
    ZERO_OUT_SERVO  #@TOP,SERVO

[gcode_macro _SAF_START_PRINT_END]
gcode:
    ZERO_OUT_SERVO  #@TOP,SERVO
    SFS_ENABLE_ACE_ENCODER      # turn the encoder runout check on once the print starts  #@TOP,ENCODER

[gcode_macro _SAF_END_PRINT_START]
gcode:
    SFS_DISABLE_ACE_ENCODER  #@TOP,ENCODER
    ZERO_OUT_SERVO  #@SERVO
    {% if printer["output_pin AUTO_UNLOAD"].value %}
        _UNLOAD_TOOL_PRINT
    {% endif %}

[gcode_macro _SAF_END_PRINT_END]
gcode:
    ZERO_OUT_SERVO  #@TOP,SERVO

[gcode_macro _SAF_ON_CANCEL]
gcode:
    SFS_DISABLE_ACE_ENCODER  #@TOP,ENCODER
    {% if printer["output_pin AUTO_UNLOAD"].value %}
        _UNLOAD_TOOL_PRINT
    {% endif %}
    PARK_FOR_CANCEL

[gcode_macro _SAF_ON_PAUSE]
gcode:
    ZERO_OUT_SERVO  #@TOP,SERVO
    _ACE_ON_PAUSE               # does nothing when the ACE_Pro switch is off

[gcode_macro _SAF_ON_RESUME]
gcode:
    ZERO_OUT_SERVO  #@TOP,SERVO
    _ACE_ON_RESUME              # does nothing when the ACE_Pro switch is off

[gcode_macro _SAF_NOZZLE_WIPE]
gcode:
    ZERO_OUT_SERVO  #@TOP,SERVO,IFEXISTS
