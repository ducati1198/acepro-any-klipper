# ============================================================================
# Generic Pause/Resume Macros (ACE-agnostic)
# ============================================================================
# Organized and maintained by Ducati_1198
# Shoutout to the original project: https://github.com/Kobra-S1/ACEPRO
# ============================================================================
# External/consumer macros expected elsewhere:
# - CUT_TIP (optional if using PAUSE with cut_filament)
# - TO_THROW_POSITION (used during pause/resume purge)
# - RESUME_NOZZLE_WIPE_SEQUENCE (used during resume purge)
# - _ACE_STATE (optional: used in RESUME to reload tool when ACE enabled)
######################################################################

# Pause/Resume state that is not ACE-specific (also used when ACE is off)
[gcode_macro _PAUSE_RESUME_STATE]
variable_pause_nozzle_timeout_triggered: 0   # Flag: nozzle timeout has already lowered temperature (0/1)
variable_pre_pause_temp: 0                    # Extruder target temperature saved before PAUSE (°C)
gcode:
  # no gcode — just holds variables

[gcode_macro INSERT_EXTRUDE_50]
description: Extrude additional 50mm after filament insert
gcode:
    M83
    G92 E0
    G1 E50 F300
    G92 E0

[gcode_macro INSERT_RESUME_PRINT]
description: Resume print after filament insert prompt
gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    RESUME

[gcode_macro INSERT_CANCEL_PRINT]
description: Cancel print from filament insert prompt
gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    CANCEL_PRINT

[gcode_macro INSERT_LOAD_FILAMENT]
description: Load filament from idle insert prompt
gcode:
  RESPOND TYPE=command MSG=action:prompt_end
  LOAD_FILAMENT

[gcode_macro INSERT_DISMISS]
description: Dismiss filament insert dialog
gcode:
  RESPOND TYPE=command MSG=action:prompt_end

[gcode_macro RUNOUT_DISMISS]
description: Close runout dialog
gcode:
    RESPOND TYPE=command MSG=action:prompt_end

[gcode_macro RUNOUT_CANCEL_PRINT]
description: Cancel print from runout dialog
gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    CANCEL_PRINT

#####################################################################################################################################
# JUST FOR SIMPLE AF PRINTER #### ADD THIS MACRO _SAF_ACE_TOOL_LOAD TO CUSTOM HOOKS [gcode_macro _SAF_START_PRINT_BEFORE_LINE_PURGE]
# Orca Slicer Machine Start G-Code: SET_GCODE_VARIABLE MACRO=_SAF_ACE_TOOL_LOAD VARIABLE=requested_tool VALUE={initial_tool}
######## BUT BETTER TO USE THE MY_PRINT_START MACROS ############
#####################################################################################################################################

[gcode_macro _SAF_ACE_TOOL_LOAD]
description: Load the requested ACE tool and wipe nozzle (used before purge line)
variable_requested_tool: -1   # Will be set by slicer start G‑code
gcode:
    {% set tool = params.TOOL|default(printer["gcode_macro _SAF_ACE_TOOL_LOAD"].requested_tool)|int %}
    {% if tool < 0 %}
        { action_respond_info("SAF ACE: No tool specified, skipping load") }
    {% else %}
        # Smart logic: check if tool already loaded
        {% set ace_index = printer.save_variables.variables.ace_current_index|default(-1)|int %}
        {% set filament_pos = printer.save_variables.variables.ace_filament_pos|default('none') %}
        {% set is_physically_loaded = printer["filament_switch_sensor filament_runout_nozzle"].filament_detected %}

        {% if tool == ace_index and filament_pos == 'nozzle' and is_physically_loaded %}
            { action_respond_info("SAF ACE: Tool %d already loaded – skipping" % tool) }
        {% else %}
            { action_respond_info("SAF ACE: Loading tool %d..." % tool) }
            # Load the tool (this calls ACE_CHANGE_TOOL, which includes purge and wipe)
            T{tool}
            M400
        {% endif %}
    {% endif %}

[gcode_macro PARK_FOR_CANCEL]
description: Simple park move for cancel (uses _CLIENT_VARIABLE coordinates)
gcode:
    {% if "xyz" in printer.toolhead.homed_axes %}
        {% set client = printer["gcode_macro _CLIENT_VARIABLE"] %}
        {% set park_x = client.park_at_cancel_x|default(300) %}
        {% set park_y = client.park_at_cancel_y|default(280) %}
        {% set speed = printer.configfile.settings.pause_resume.recover_velocity|default(50) * 60 %}
        G90
        G1 X{park_x} Y{park_y} F{speed}
        { action_respond_info("PARK_FOR_CANCEL: Parked at X%.1f Y%.1f" % (park_x, park_y)) }
    {% else %}
        RESPOND TYPE=error MSG="PARK_FOR_CANCEL: Printer not homed, cannot park"
    {% endif %}

######################################################################
# Enhanced Pause/Resume
######################################################################

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
variable_nozzle_timeout_seconds: 600
variable_standby_nozzle_temp: 150
gcode:
  
  ZERO_OUT_SERVO # ===== RETRACT SERVO BEFORE ANY MOVEMENT =====

  {% set z = params.Z|default(10)|int %}
  {% set cut_filament = params.CUT_FILAMENT|default(0)|int %}
  {% set standby = params.STANDBY|default(0)|int %}

  {% if printer['pause_resume'].is_paused|int == 0 %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}

    {% set current_target = printer.extruder.target|int %}
    {% if current_target > 0 %}
      SET_GCODE_VARIABLE MACRO=_PAUSE_RESUME_STATE VARIABLE=pre_pause_temp VALUE={current_target}
      {action_respond_info("ANY[m]: PAUSE: Saved pre-pause temp: %d°C" % current_target)}
    {% endif %}

    BASE_PAUSE

    SAVE_GCODE_STATE NAME=PAUSE_LOCAL
      G90
      M82
      VEL_PUSH
      SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=2500 VELOCITY=200 SQUARE_CORNER_VELOCITY=5

      # --- Extruder retraction (before any movement) ---
      {% set vars = printer["gcode_macro _ACE_VARS"] %}
      {% set retract_len = vars.pause_extruder_retract|float %}
      {% set retract_speed = vars.pause_extruder_retract_speed|float %}
      {% if retract_len > 0 %}
          { action_respond_info("PAUSE: Retracting %.1fmm filament" % retract_len) }
          M83                # Switch to relative extrusion
          G1 E-{retract_len} F{retract_speed * 60}
          M82                # Switch back to absolute
          G92 E0             # Reset extruder position to avoid drift
      {% endif %}

      {% if cut_filament == 1 %}
        {action_respond_info("ANY[m]: PAUSE: Cutting filament")}
        CUT_TIP
      {% else %}
        {action_respond_info("ANY[m]: PAUSE: Moving to throw position")}
      {% endif %}
      
      G91
      G1 Z3 F1500 # Lift nozzle before moving (25mm/s)
      G90
      
      TO_THROW_POSITION

      # ===== SAFETY: Ensure bed is at safe height for servo deployment =====
      {% set current_z = printer.toolhead.position.z %}
      {% if current_z < vars.servo_min_z %}
          { action_respond_info("PAUSE: Raising bed to minimum servo height %d mm" % vars.servo_min_z) }
          G90
          G0 Z{vars.servo_min_z} F{vars.servo_z_speed * 60}
          M400
      {% endif %}

      # ===== DETECT FAILED TOOL CHANGE (to skip servo deployment) =====
      {% set current_tool_state = printer.save_variables.variables.ace_current_index|default(-1)|int %}
      {% set filament_pos_state = printer.save_variables.variables.ace_filament_pos|default('bowden') %}
      {% set sensor_state = printer["filament_switch_sensor filament_runout_nozzle"].filament_detected|default(false) %}
      {% set is_failure_pause = (current_tool_state >= 0) and (filament_pos_state == 'bowden') and (not sensor_state) %}
      {% if is_failure_pause %}
          { action_respond_info("PAUSE: Tool change failure detected – skipping servo deployment") }
      {% endif %}

      # --- SERVO HANDLING ON PAUSE (skip if failure) ---
      {% if not is_failure_pause and vars.servo_enable | lower == 'true' %}
          # Lower bed by bed_pause_z_drop to clear the brush
          {% set bed_drop = vars.bed_pause_z_drop | float %}
          {% if bed_drop > 0 %}
              G91
              G1 Z{bed_drop} F{vars.servo_z_speed * 60}
              G90
              M400
          {% endif %}
          # Deploy servo
          SET_SERVO SERVO={vars.servo_name} ANGLE={vars.servo_deploy_angle}
          G4 P{(vars.servo_deploy_delay * 1000)|int}
#          G4 P{vars.servo_deploy_delay * 1000}
      {% endif %}

      VEL_POP
      RESTORE_GCODE_STATE NAME=PAUSE_LOCAL MOVE=0

    {% if standby == 1 and printer['extruder'].target|int > 0 %}
      {% set target = printer['extruder'].target|int %}
      {% set standby_drop = 20 %}
      {% set standby_temp = (target - standby_drop) if (target - standby_drop) > 0 else 0 %}
      M104 S{standby_temp}
      {action_respond_info("ANY[m]: PAUSE: Immediate standby mode - nozzle at %s°C" % standby_temp)}
    {% else %}
      {% set timeout = printer["gcode_macro PAUSE"].nozzle_timeout_seconds|int %}
      {action_respond_info("ANY[m]: PAUSE: Nozzle will auto-cool to standby after %s seconds" % timeout)}
      UPDATE_DELAYED_GCODE ID=PAUSE_NOZZLE_TIMEOUT DURATION={timeout}
    {% endif %}

    SET_IDLE_TIMEOUT TIMEOUT=43200
    SET_GCODE_VARIABLE MACRO=_PAUSE_RESUME_STATE VARIABLE=pause_nozzle_timeout_triggered VALUE=0

  {% endif %}


[delayed_gcode PAUSE_NOZZLE_TIMEOUT]
gcode:
    {% if printer['pause_resume'].is_paused|int == 1 %}
        {% set standby_temp = printer["gcode_macro PAUSE"].standby_nozzle_temp|int %}
        { action_respond_info("ANY[m]: Pause timeout reached, lowering to standby temp %d°C" % standby_temp) }
        M104 S{standby_temp}
        SET_GCODE_VARIABLE MACRO=_PAUSE_RESUME_STATE VARIABLE=pause_nozzle_timeout_triggered VALUE=1
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    RESPOND TYPE=echo MSG="ANY[m] [RESUME] initiated"
    RESPOND TYPE=command MSG=action:prompt_end
    {% set client_vel = printer.configfile.settings.pause_resume.recover_velocity|default(50.0) %}
    {% set vars = printer["gcode_macro _ACE_VARS"] %}

    # --- Read configurable variables from _ACE_VARS (with fallbacks) ---
    {% set default_purge = vars.resume_purge_amount|default(40)|float %}
    {% set purge_amount = params.PURGE|default(default_purge)|float %}
    {% set extra_prime = vars.resume_extra_prime|default(1.0)|float %}
    {% set pre_wipe_retract = vars.resume_post_wipe_retract|default(1.0)|float %}

    {% if printer['pause_resume'].is_paused|int == 1 %}
        UPDATE_DELAYED_GCODE ID=PAUSE_NOZZLE_TIMEOUT DURATION=0
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
        SAVE_GCODE_STATE NAME=RESUME_WRAP

        # --- Reheat nozzle if needed ---
        {% if etemp > 0 %}
            {% set timeout_triggered = printer["gcode_macro _PAUSE_RESUME_STATE"].pause_nozzle_timeout_triggered|int %}
            {% if timeout_triggered == 1 %}
                {% set msg = "ANY[m]: RESUME: Reheating nozzle from standby to " ~ etemp ~ "°C" %}
                RESPOND TYPE=echo MSG="{msg}"
            {% endif %}
            MOVE_HEAT_POS
            M109 S{etemp|int}
        {% endif %}

        # ------------------------------------------------------------
        # ACE tool reactivation – only if filament is NOT already present
        # ------------------------------------------------------------
        {% set call_tool_change = false %}
        {% set ace_enabled = printer.configfile.settings.get('output_pin ACE_Pro', None) is not none %}
        {% if ace_enabled %}
            {% set active_tool = printer["gcode_macro _ACE_STATE"].active %}
            {% set filament_detected = false %}
            {% set sensor_exists = printer.configfile.settings.get('filament_switch_sensor filament_runout_nozzle', None) is not none %}
            {% if sensor_exists %}
                {% set filament_detected = printer["filament_switch_sensor filament_runout_nozzle"].filament_detected %}
            {% endif %}
            {% if active_tool >= 0 and not filament_detected %}
                {% set call_tool_change = true %}
                {% set msg = "ANY[m]: Will reload ACE tool T" ~ active_tool ~ " (no filament detected)" %}
                RESPOND TYPE=echo MSG="{msg}"
            {% elif active_tool >= 0 and filament_detected %}
                {% set msg = "ANY[m]: SKIPPING ACE reload – filament already present" %}
                RESPOND TYPE=echo MSG="{msg}"
                UPDATE_DELAYED_GCODE ID=SYNC_ACE_AFTER_MANUAL_LOAD DURATION=1
            {% endif %}
        {% endif %}

                # --- If we are calling T{active_tool}, let ACE handle purge/wipe (skip macro's own purge) ---
        {% set skip_purge = call_tool_change %}
            {% set msg = "ANY[m]: Skipping macro purge/wipe – ACE tool change will handle it" %}
            RESPOND TYPE=echo MSG="{msg}"
            {% if purge_amount > 0 and not skip_purge %}
            T{active_tool}
            M400
        {% endif %}

        # # --- If we are calling T{active_tool}, let ACE handle purge/wipe (skip macro's own purge) ---
        # {% if call_tool_change %}
        #     {% set msg = "ANY[m]: Skipping macro purge/wipe – ACE tool change will handle it" %}
        #     RESPOND TYPE=echo MSG="{msg}"
        #     {% set purge_amount = 0 %}
        #     T{active_tool}
        #     M400
        # {% endif %}

        G92 E0
        RESPOND TYPE=echo MSG="ANY[m]: Extruder position reset to E=0"

        # --- Macro's own purge/wipe (only if purge_amount > 0) ---
        {% if purge_amount > 0 %}
            TO_THROW_POSITION

            # Optional pre‑wipe retraction
            {% if pre_wipe_retract > 0 %}
                {% set msg = "ANY[m]: Retracting " ~ pre_wipe_retract ~ "mm before wipe" %}
                RESPOND TYPE=echo MSG="{msg}"
                G91
                G1 E-{pre_wipe_retract} F600
                G90
            {% endif %}

            # Purge filament
            {% set was_abs_e = printer.gcode_move.absolute_extrude %}
            M83
            G1 E{purge_amount} F300
            {% if was_abs_e %} M82 {% endif %}

            # Wipe nozzle
            SAVE_GCODE_STATE NAME=RESUME_LOCAL
            VEL_PUSH
            SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=2500 VELOCITY=200 SQUARE_CORNER_VELOCITY=5
            RESUME_NOZZLE_WIPE_SEQUENCE
            FLUSH_POOP

            # Retract servo if used
            {% if vars.servo_enable|lower == 'true' %}
                SET_SERVO SERVO={vars.servo_name} ANGLE={vars.servo_retract_angle}
                G4 P{(vars.servo_deploy_delay * 1000)|int}
#                G4 P{vars.servo_retract_delay * 1000}
                {% if vars.servo_poweroff_delay > 0 %}
                    UPDATE_DELAYED_GCODE ID=disable_servo_delayed DURATION={vars.servo_poweroff_delay / 1000}
                {% else %}
                    SET_SERVO SERVO={vars.servo_name} WIDTH=0
                {% endif %}
            {% endif %}

            SERVO_SHAKE
            VEL_POP
            RESTORE_GCODE_STATE NAME=RESUME_LOCAL MOVE=0
        {% else %}
            {% set msg = "ANY[m]: No purge/wipe needed (handled by ACE or manual load)" %}
            RESPOND TYPE=echo MSG="{msg}"
            # Still retract servo if it was deployed
            {% if vars.servo_enable|lower == 'true' %}
                SET_SERVO SERVO={vars.servo_name} ANGLE={vars.servo_retract_angle}
                G4 P{vars.servo_retract_delay * 1000}
                {% if vars.servo_poweroff_delay > 0 %}
                    UPDATE_DELAYED_GCODE ID=disable_servo_delayed DURATION={vars.servo_poweroff_delay / 1000}
                {% else %}
                    SET_SERVO SERVO={vars.servo_name} WIDTH=0
                {% endif %}
            {% endif %}
        {% endif %}

        # --- Extra prime just before resuming (if configured) ---
        {% if extra_prime > 0 %}
            {% set msg = "ANY[m]: Extra prime " ~ extra_prime ~ "mm before resume" %}
            RESPOND TYPE=echo MSG="{msg}"
            G91
            G1 E{extra_prime} F300
            G90
            G92 E0
        {% endif %}

        G92 E0
        RESTORE_GCODE_STATE NAME=RESUME_WRAP MOVE=0
        BASE_RESUME VELOCITY={params.VELOCITY|default(client_vel)}
    {% else %}
        RESPOND TYPE=echo MSG="ANY[m] [RESUME] called, but not paused"
    {% endif %}

[delayed_gcode SYNC_ACE_AFTER_MANUAL_LOAD]
initial_duration: 0
gcode:
    {% set ace_enabled = printer.configfile.settings.get('output_pin ACE_Pro', None) is not none %}
    {% if ace_enabled %}
        {% set active_tool = printer["gcode_macro _ACE_STATE"].active %}
        {% if active_tool >= 0 %}
            RESPOND TYPE=echo MSG="ACE: Syncing state after manual load"
            ACE_DEBUG_SET_FILAMENT_STATE STATE=nozzle
            ACE_DEBUG_SET_CURRENT_INDEX TOOL={active_tool}
        {% endif %}
    {% endif %}

