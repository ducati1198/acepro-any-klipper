[gcode_macro TO_THROW_POSITION]
description: Move to a safe position for filament operations (poop area)
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    VEL_PUSH
    SET_VELOCITY_LIMIT ACCEL=20000 ACCEL_TO_DECEL=5000 VELOCITY=300
    G90
    G1 X{vars.poop_x} Y{vars.poop_y} F12000
    VEL_POP

[gcode_macro TO_BLADE]
description: Move to blade position (cutter block)
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    VEL_PUSH
    SET_VELOCITY_LIMIT ACCEL=20000 ACCEL_TO_DECEL=5000 VELOCITY=300
    G90
    G1 X{vars.cut_block_x} Y{vars.cut_block_y} F20000
    VEL_POP

[gcode_macro TO_FRONT_OF_THROW_BLADE]
description: Move to front of throw blade (engage position)
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    VEL_PUSH
    SET_VELOCITY_LIMIT ACCEL=20000 ACCEL_TO_DECEL=5000 VELOCITY=300
    G90
    G1 X{vars.cut_engage_x} Y{vars.cut_engage_y} F150000
    VEL_POP

[gcode_macro TO_FRONT_OF_THROW_BLADE_2]
description: Move to front of throw blade (full cut position)
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    VEL_PUSH
    SET_VELOCITY_LIMIT ACCEL=20000 ACCEL_TO_DECEL=5000 VELOCITY=300
    G90
    G1 X{vars.cut_full_x} Y{vars.cut_full_y} F15000
    VEL_POP

[gcode_macro TO_FRONT_OF_THROW_BLADE_SLOW]
description: Move slowly back‑and‑forth between oscillation points before nozzle shake
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    {% set start_x = vars.nozzle_osc_start_x | float %}
    {% set start_y = vars.nozzle_osc_start_y | float %}
    {% set stop_x  = vars.nozzle_osc_stop_x | float %}
    {% set stop_y  = vars.nozzle_osc_stop_y | float %}
    {% set cycles = vars.nozzle_osc_cycles | int %}
    {% set speed  = vars.nozzle_osc_speed | int %}

    VEL_PUSH
    SET_VELOCITY_LIMIT ACCEL=20000 ACCEL_TO_DECEL=5000 VELOCITY=300

    # Move to start position
    G90
    G1 X{start_x} Y{start_y} F{speed}
    M400

    # Perform back‑and‑forth passes
    {% for i in range(cycles) %}
        # Move to stop position
        G1 X{stop_x} Y{stop_y} F{speed}
        M400
        # Move back to start position (except after last cycle)
        {% if i < cycles - 1 %}
            G1 X{start_x} Y{start_y} F{speed}
            M400
        {% endif %}
    {% endfor %}

    VEL_POP

[gcode_macro MOVE_HEAT_POS]
description: Move to a position while heating, optionally deploy servo
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    VEL_PUSH
    SET_VELOCITY_LIMIT ACCEL=20000 ACCEL_TO_DECEL=5000 VELOCITY=300
    G90
    G1 Y{vars.heat_pos_y1} F36000
    G1 X{vars.heat_pos_x1}
    G1 Y{vars.heat_pos_y2}
    G1 X{vars.heat_pos_x2}
    VEL_POP

    # --- Optionally deploy servo while heating ---
    {% if vars.deploy_servo_during_heat | lower == 'true' and vars.servo_enable | lower == 'true' %}
        # Check current Z height (bed position)
        {% set current_z = printer.toolhead.position.z %}
        {% if current_z < vars.servo_min_z %}
            M118 ACE: Raising bed to minimum servo height ({vars.servo_min_z}mm) for heat‑position deploy
            G0 Z{vars.servo_min_z} F{vars.servo_z_speed * 60}
        {% endif %}

        # Deploy servo
        SET_SERVO SERVO={vars.servo_name} ANGLE={vars.servo_deploy_angle}
        G4 P{vars.servo_deploy_delay * 1000}
    {% endif %}

[gcode_macro UNDERLINE]
description: Purge line routine (conditional)
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    {% if vars.enable_purge_line | lower == 'true' %}
        M83
        G90
        G92 E0
        G0 X{vars.purge_line_start_x} Y{vars.purge_line_start_y} F7200
        G1 Z{vars.purge_line_z} F1200
        G1 X{vars.purge_line_end_x} E6 F{vars.purge_line_feed}
        G1 Y{vars.purge_line_end_y}   E0.6 F{vars.purge_line_feed}
        G1 X{vars.purge_line_return_x}   E6 F{vars.purge_line_feed}
        G92 E0
        M82
    {% else %}
        { action_respond_info("ACE: Purge line skipped (enable_purge_line = False)") }
    {% endif %}

# ===== New Wipe Macro =====
[gcode_macro RESUME_NOZZLE_WIPE_SEQUENCE]
description: Perform nozzle wipe using selected pattern (STRAIGHT or ZIGZAG), repeated wipe_qty times
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    {% set pattern = vars.wipe_pattern | upper %}
    {% set x = vars.wipe_start_x | float %}
    {% set y = vars.wipe_start_y | float %}
    {% set l = vars.wipe_length | float %}
    {% set s = vars.wipe_speed | int %}
    {% set qty = vars.wipe_qty | int %}
    # Move to start position
    G90
    G1 X{x} Y{y} F{s}
    # Perform the chosen wipe pattern qty times
    {% for pass in range(qty) %}
        {% if pattern == "STRAIGHT" %}
            _WIPE_STRAIGHT X={x} Y={y} LEN={l} SPD={s} DIR=X TRAVEL=NORMAL
        {% elif pattern == "ZIGZAG" %}
            _WIPE_ZIGZAG X={x} Y={y} LEN={l} SPD={s} DIR=X TRAVEL=NORMAL
        {% else %}
            { action_respond_info("Unknown wipe pattern: " ~ pattern ~ " - defaulting to STRAIGHT") }
            _WIPE_STRAIGHT X={x} Y={y} LEN={l} SPD={s} DIR=X TRAVEL=NORMAL
        {% endif %}
    {% endfor %}

######################################################################
# Cutter macro
######################################################################

[gcode_macro CUT_TIP]
description: Cut filament tip using engage/full positions with back-and-forth cycles
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    RESPOND TYPE=echo MSG="K1MAX: CUT_TIP start"
    {% if "xy" not in printer.toolhead.homed_axes %}
        G28 Y X
    {% endif %}

    SAVE_GCODE_STATE NAME=ks1_cut_state

    # Geometry & safety
    {% set safety = 0.5 %}
    {% set y_min = printer.toolhead.axis_minimum.y|float %}
    {% set y_max = printer.toolhead.axis_maximum.y|float %}
    {% set x_min = printer.toolhead.axis_minimum.x|float %}
    {% set x_max = printer.toolhead.axis_maximum.x|float %}

    # --- Move to cutter block (safe position) ---
    G90
    G1 X{ vars.cut_block_x } Y{ vars.cut_block_y } F8000

    # --- Determine cut axis and direction ---
    {% set axis = vars.cut_axis | upper %}
    {% if axis == 'X' %}
        {% set start_pos = vars.cut_engage_x %}
        {% set end_pos = vars.cut_full_x %}
        {% set other_y = vars.cut_engage_y %}  # Y stays constant
        # Clamp positions to axis limits
        {% set start_pos = start_pos if start_pos >= x_min else x_min %}
        {% set start_pos = start_pos if start_pos <= x_max else x_max %}
        {% set end_pos = end_pos if end_pos >= x_min else x_min %}
        {% set end_pos = end_pos if end_pos <= x_max else x_max %}
    {% else %}  # default to Y
        {% set axis = 'Y' %}
        {% set start_pos = vars.cut_engage_y %}
        {% set end_pos = vars.cut_full_y %}
        {% set other_x = vars.cut_engage_x %}  # X stays constant
        # Clamp positions to axis limits
        {% set start_pos = start_pos if start_pos >= y_min else y_min %}
        {% set start_pos = start_pos if start_pos <= y_max else y_max %}
        {% set end_pos = end_pos if end_pos >= y_min else y_min %}
        {% set end_pos = end_pos if end_pos <= y_max else y_max %}
    {% endif %}

    # --- Move to engage position ---
    {% if axis == 'X' %}
        G1 X{ start_pos } Y{ other_y } F{ vars.cut_speed }
    {% else %}
        G1 X{ other_x } Y{ start_pos } F{ vars.cut_speed }
    {% endif %}
    M400

    # --- Perform cutting cycles ---
    {% for i in range(vars.cut_repetitions | int) %}
        # Move to full position
        {% if axis == 'X' %}
            G1 X{ end_pos } F{ vars.cut_speed }
        {% else %}
            G1 Y{ end_pos } F{ vars.cut_speed }
        {% endif %}
        M400

        # Optional pause at full position
        {% if vars.cut_pause_ms | int > 0 %}
            G4 P{ vars.cut_pause_ms | int }
        {% endif %}

        # Move back to engage position (if not last cycle or if more cycles)
        {% if i < (vars.cut_repetitions | int) - 1 %}
            {% if axis == 'X' %}
                G1 X{ start_pos } F{ vars.cut_speed }
            {% else %}
                G1 Y{ start_pos } F{ vars.cut_speed }
            {% endif %}
            M400
        {% endif %}
    {% endfor %}

    # --- Filament dance (retract a bit, extrude, retract) ---
    FORCE_MOVE STEPPER="extruder" DISTANCE=-2 VELOCITY=10
    FORCE_MOVE STEPPER="extruder" DISTANCE=2 VELOCITY=10
    FORCE_MOVE STEPPER="extruder" DISTANCE=-2 VELOCITY=10 
    
    # --- Move to cutter block then to poop area ---
    G1 X{ vars.cut_block_x } Y{ vars.cut_block_y } F{ vars.cut_speed }
    TO_THROW_POSITION
    FORCE_MOVE STEPPER="extruder" DISTANCE=2 VELOCITY=10

    # Restore modes/feeds (not position)
    RESTORE_GCODE_STATE NAME=ks1_cut_state MOVE=0 MOVE_SPEED=200

[gcode_macro FLUSH_POOP]
description: Flush
gcode:
  TO_THROW_POSITION
  TO_FRONT_OF_THROW_BLADE_SLOW
  G4 P500
  TO_THROW_POSITION
  M106 S255  
  G4 P1000
  {% set vars = printer["gcode_macro _ACE_VARS"] %}
  {% if vars.post_purge_shake_enable|lower == 'true' %}
    SHAKE_NOZZLE_HORIZONTAL AMP={vars.post_purge_shake_amp} COUNT={vars.post_purge_shake_cycles} SPEED={vars.post_purge_shake_speed}
  {% endif %}
  TO_THROW_POSITION
  TO_THROW_POSITION  
  M106 S0

[gcode_macro SHAKE_NOZZLE_HORIZONTAL]
description: "Shake nozzle left/right to remove purged filament"
# Optional parameters:
#   AMP: amplitude of shake in mm (default 5)
#   COUNT: number of shake cycles (default 4)
#   SPEED: feedrate for shaking in mm/min (default 20000)
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    {% set AMP = params.AMP|default(vars.wipe_length)|float %}
    {% set COUNT = params.COUNT|default(2)|int %}
    {% set SPEED = params.SPEED|default(20000)|float %}
    {% set AMP_NEG = 0 - AMP %}

    SAVE_GCODE_STATE NAME=shake_nozzle_state

    G91

    {% for i in range(COUNT) %}
        G1 X{AMP} F{SPEED}
        G1 X{AMP_NEG} F{SPEED}
    {% endfor %}

    G90

    RESTORE_GCODE_STATE NAME=shake_nozzle_state

# ===== Servo Macros =====
[gcode_macro ZERO_OUT_SERVO]
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    {% set poweroff_delay = vars.servo_poweroff_delay | int %}
    SET_SERVO SERVO={vars.servo_name} ANGLE=0
    G4 P{poweroff_delay}
    M400
    SET_SERVO SERVO={vars.servo_name} WIDTH=0
    RESPOND PREFIX="SERVO_WIPER: Servo zeroed and powered off"

[delayed_gcode DISABLE_SERVO_ON_STARTUP]
initial_duration: 1.0
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    {% if vars.servo_startup_zero | lower == 'true' %}
        {% set poweroff_delay = vars.servo_poweroff_delay | int %}
        SET_SERVO SERVO={vars.servo_name} ANGLE=0
        G4 P{poweroff_delay}
        M400
        # Power off after zero (optional – uncomment to enable)
        SET_SERVO SERVO={vars.servo_name} WIDTH=0
        RESPOND PREFIX="SERVO_WIPER: Startup servo zero complete"
    {% else %}
        RESPOND PREFIX="SERVO_WIPER: Startup servo zero disabled"
    {% endif %}

[delayed_gcode disable_servo_delayed]
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    SET_SERVO SERVO={vars.servo_name} WIDTH=0
    RESPOND PREFIX="SERVO_WIPER: Servo powered down after delay"


