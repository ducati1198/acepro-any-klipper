# Publishes a GitHub release when VERSION changes on main.
#
# How to use it:
#   1. Bump VERSION (for example 1.2.0) and add a "## 1.2.0 (short title)" section to CHANGELOG.md.
#   2. Push to main.
#   3. This workflow creates the tag v1.2.0 and a release whose notes are that CHANGELOG section.
#
# To publish a version that is already in VERSION (for example the first release), open the
# Actions tab, choose "Release", and press "Run workflow". If the release already exists
# nothing is changed.

name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version and notes
        id: info
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [ -n "$VERSION" ] || { echo "VERSION is empty"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # The CHANGELOG section that starts with "## <VERSION>" up to the next "## ".
          awk -v v="$VERSION" '
            $0 ~ "^## " v "([^0-9.]|$)" { found=1; print substr($0,4) > "title.txt"; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s title.txt ] || { echo "No '## $VERSION' section in CHANGELOG.md"; exit 1; }
          echo "title=v$(cat title.txt | sed 's/ *(/ - /; s/)$//')" >> "$GITHUB_OUTPUT"
          echo "Notes:"; cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.info.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "${{ steps.info.outputs.title }}" \
            --notes-file notes.md \
            --latest
