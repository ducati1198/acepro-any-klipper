# ============================================================================
# EXAMPLE: nozzle wiper with an optional servo (NOT installed by installer.sh)
# ============================================================================
# Copy this file next to your printer.cfg, edit the numbers, then add
#     [include servo_wiper.cfg]
# to printer.cfg. It gives you a WIPE_NOZZLE macro for a brush on the bed or on
# the frame (fixed mount), with or without a servo that swings the brush out.
#
# You do NOT need it for the ACE Pro. The ACE has its own wipe moves (see
# _ACE_VARS in acepro_macros.cfg). This is only for people who want a separate
# WIPE_NOZZLE, for example to call from a Simple AF hook (examples/saf_hooks_example.cfg).
#
# The servo here is the same one the ACE uses for the poop basket
# ([servo servo_wipe], written by the installer into acepro_servo.cfg). If you have
# no servo, set variable_servo_enabled to "OFF" below.
#
# Origin: Simplified V2.1 by Ducati_1198, a remix of PROWIPER by Dawson Purcell
# (3DPHUB.NET). Check the licence of the original before you redistribute it.
#
# Every position below is a PLACEHOLDER. WIPE_NOZZLE stops with a message until you
# have measured them for your printer and set variable_wiper_confirmed to "YES".
# ============================================================================

# COMMENT OUT IF GETTING VIRTUAL PINS ERROR

[output_pin SERVO_WIPER]
pin: virtual_pin:SERVO_WIPER_pin
value: 1

# The servo itself ([servo servo_wipe]) comes from acepro_servo.cfg (ACE installer).

[gcode_macro WIPE_NOZZLE]
description: SERVO_WIPER or No Servo for CoreXY Version - BED mount or FIXED mount for multicolor

# Mount type and basic settings
variable_wiper_confirmed       : "NO"        # set to "YES" after you measured every position below
variable_servo_mount_type       : "FIXED"       # BED (brush on bed) or FIXED (brush on frame for multicolor)
variable_fixed_bed_drop         : 50          # mm to drop bed for nozzle clearance when FIXED mount (5-10mm typical)
variable_fixed_servo_pause      : 1000        # ms pause in FIXED mode after servo deploy/retract before bed moves (0 to disable)

# Brush and wipe configuration
variable_brush_mount            : "CUSTOM"    # Only CUSTOM supported
variable_wipe_pattern           : "ZIGZAG"    # STRAIGHT or ZIGZAG
variable_wipe_direction         : "X"         # X or Y direction for wiping
variable_wipe_travel_direction  : "NORMAL"    # NORMAL or REVERSE - NORMAL: X=left-to-right, Y=front-to-back | REVERSE: X=right-to-left, Y=back-to-front
variable_speed                  : 7500        # Wipe speed mm/min
variable_wipe_qty               : 3           # Number of wipe passes

# Temperature and extrusion
variable_nozzle_temp_pad        : 10          # Degrees below print temp
variable_nozzle_temp_limit      : 300         # Max temp limit
variable_hot_wipe               : "ON"        # Wait for temp before wipe
variable_ensure_cooling         : "ON"        # Extra cooling wipes
variable_extrude_amount         : "OFF"       # Extrude before wipe
variable_retract_amount         : 2.5         # Retract after extrude

# Servo control
variable_servo_enabled          : "ON"        # ON = servo controlled, OFF = no servo (skip all servo commands)
variable_servo_deploy_angle     : 87          # Servo deploy angle
variable_servo_retract_angle    : 0           # Servo retract angle
variable_servo_keep_powered     : 120         # Seconds to keep powered

# Preheat and fans
variable_preheat                : "OFF"       # Preheat after wipe
variable_preheat_bed_temp       : 60          # Preheat bed temp
variable_preheat_nozzle_temp    : 60          # Preheat nozzle temp
variable_fan_speed              : 255         # Fan speed for preheat
variable_console_output         : "ON"        # Console messages
variable_bed_fans_installed     : "FALSE"     # Bed fans installed

# Geometry
variable_bot_clearance          : 20          # Clearance below bed
variable_drop_distance          : 15          # Bed drop for travel (BED mount only)
variable_spacer_height          : 0           # Bed spacer height

# Brush position (CUSTOM mount)
variable_custom_start_x         : 100         # Brush X position (starting point)
variable_custom_start_y         : 100         # Brush Y position (starting point)
variable_custom_start_z         : 14          # Brush Z height (BED mount only)
variable_custom_length          : 14          # Brush length (travel distance for wipe)

# Brush position (Fixed mount)
variable_poop_location_enable   : "ON"       # Enable separate poop location for parking before servo deploy (FIXED mode only)
variable_poop_x                 : 100        # Poop location X
variable_poop_y                 : 100        # Poop location Y

# Bed drop during pause for tool changes (FIXED mode only)
variable_bed_pause_z_drop       : 50          # mm to lower bed when pausing (to clear the brush)
variable_park_x                 : 100         # Park X position during pause (0 = stay at current X)
variable_park_y                 : 100         # Park Y position during pause (0 = stay at current Y)

# Parking and cooling positions after wipe
variable_heat_pos_x1            : 100       # First park X after wipe
variable_heat_pos_y1            : 100         # First park Y after wipe
variable_heat_pos_x2            : 100       # Second park X
variable_heat_pos_y2            : 100       # Second park Y
variable_heat_pos_x3            : 100       # Third park X (final)
variable_heat_pos_y3            : 100         # Third park Y (final)
variable_cool_target_temp       : 148         # Target temperature before moving to final park

gcode:
    # --- Safety: do nothing until the placeholder positions are replaced ---
    {% if wiper_confirmed|upper != "YES" %}
        { action_raise_error("WIPE_NOZZLE: positions are placeholders. Measure them, then set variable_wiper_confirmed to YES.") }
    {% endif %}

    # --- Parameter overrides (if provided) ---
    {% set KEEP_TEMP     = params.KEEP_TEMP|default(0)|int %}
    {% set FAN_SPEED_OVR = params.FAN_SPEED|default(-1)|int %}
    {% set TARGET_TEMP_OVR = params.TARGET_TEMP|default("")|string %}

    # --- Original variable setup ---
    {% if printer['output_pin SERVO_WIPER'].value == 0 %}
        {% set wipe_pattern = "DISABLED" %}
    {% endif %}

    {% if wipe_pattern in ["OFF", "DISABLED"] %}
        RESPOND PREFIX="Nozzle wiping [DISABLED]"
        {% set SERVO_ONLY = true %}
    {% else %}
        {% set SERVO_ONLY = false %}
    {% endif %}

    {% if brush_mount != "CUSTOM" %}
        RESPOND PREFIX="ERROR: Only CUSTOM supported"
        {% set wipe_pattern = "DISABLED" %}
        {% set SERVO_ONLY = true %}
    {% endif %}

    # CASE-SENSITIVE VALIDATION FOR SERVO_MOUNT_TYPE
    {% set mount_type_upper = servo_mount_type|upper %}
    {% if mount_type_upper not in ["BED", "FIXED"] %}
        RESPOND PREFIX="ERROR: servo_mount_type must be BED or FIXED (case sensitive). You entered: {servo_mount_type}"
        RESPOND PREFIX="ERROR: Please check your configuration and use exact case: BED or FIXED"
        {% set wipe_pattern = "DISABLED" %}
        {% set SERVO_ONLY = true %}
        {% set fixed_mode = false %}
    {% elif mount_type_upper == "FIXED" %}
        {% set fixed_mode = true %}
    {% else %}
        {% set fixed_mode = false %}
    {% endif %}

    # VALIDATE WIPE DIRECTION
    {% set wipe_dir_upper = wipe_direction|upper %}
    {% if wipe_dir_upper not in ["X", "Y"] %}
        {% if console_output == "ON" %}
            RESPOND PREFIX="WARNING: wipe_direction must be X or Y, defaulting to X"
        {% endif %}
        {% set wipe_dir_upper = "X" %}
    {% endif %}

    # VALIDATE WIPE TRAVEL DIRECTION
    {% set travel_dir_upper = wipe_travel_direction|upper %}
    {% if travel_dir_upper not in ["NORMAL", "REVERSE"] %}
        {% if console_output == "ON" %}
            RESPOND PREFIX="WARNING: wipe_travel_direction must be NORMAL or REVERSE, defaulting to NORMAL"
        {% endif %}
        {% set travel_dir_upper = "NORMAL" %}
    {% endif %}

    # Check servo enabled
    {% set servo_enabled_upper = servo_enabled|upper %}
    {% if servo_enabled_upper == "ON" %}
        {% set use_servo = true %}
    {% else %}
        {% set use_servo = false %}
        {% if console_output == "ON" and not SERVO_ONLY %}
            RESPOND PREFIX="SERVO_WIPER: Servo disabled (servo_enabled = OFF) – skipping all servo commands"
        {% endif %}
    {% endif %}

    {% set limit_x = printer.toolhead.axis_maximum.x|float %}
    {% set limit_y = printer.toolhead.axis_maximum.y|float %}
    {% set limit_z = printer.toolhead.axis_maximum.z|float %}

    # Calculate start and end positions based on travel direction
    {% if travel_dir_upper == "NORMAL" %}
        {% set start_x = custom_start_x %}
        {% set start_y = custom_start_y %}
        {% set end_x = custom_start_x + custom_length %}
        {% set end_y = custom_start_y + custom_length %}
    {% else %}
        {% set start_x = custom_start_x + custom_length %}
        {% set start_y = custom_start_y + custom_length %}
        {% set end_x = custom_start_x %}
        {% set end_y = custom_start_y %}
    {% endif %}

    {% set brush_length = custom_length %}

    # NOTE: starting_z will be captured AFTER homing to ensure accurate position

    {% if fixed_mode %}
        # FIXED MOUNT: Brush on frame, bed drops slightly for clearance
        {% set wipe_z_height = custom_start_z + spacer_height %}

        {% if console_output == "ON" and not SERVO_ONLY %}
            RESPOND PREFIX="SERVO_WIPER: FIXED mount - Brush at Z:{wipe_z_height}, bed will drop {fixed_bed_drop}mm, servo pause {fixed_servo_pause}ms"
        {% endif %}

    {% else %}
        # BED MOUNT: Original behavior, brush moves with bed
        {% set wipe_z_height = custom_start_z + spacer_height %}
        {% set bed_target_z = wipe_z_height %}

        {% if console_output == "ON" and not SERVO_ONLY %}
            RESPOND PREFIX="SERVO_WIPER: BED mount - Brush at Z:{bed_target_z}"
        {% endif %}

    {% endif %}

    {% if "xyz" not in printer.toolhead.homed_axes and not SERVO_ONLY %}
        {% if console_output == "ON" %}RESPOND PREFIX="SERVO_WIPER: Homing..."{% endif %}
        G28
    {% endif %}

    # CAPTURE STARTING Z POSITION AFTER HOMING IS ENSURED
    {% set starting_z = printer.toolhead.position.z %}

    {% if fixed_mode %}
        # FIXED MOUNT: Calculate bed drop position now that we have accurate Z
        {% set bed_target_z = starting_z + fixed_bed_drop %}
        {% set bed_target_z = [bed_target_z, limit_z - bot_clearance]|min %}
    {% endif %}

    {% if SERVO_ONLY %}
        # If servo only mode, optionally deploy servo if enabled
        {% if use_servo %}
            SET_SERVO SERVO=servo_wipe ANGLE={servo_deploy_angle}
            G4 P550
            M400
            G4 P1000
        {% else %}
            RESPOND PREFIX="SERVO_WIPER: Servo disabled, nothing to do"
        {% endif %}
    {% else %}

        # Determine target temperature (with override)
        {% if TARGET_TEMP_OVR|lower == "current" %}
            {% set target_temp = printer.extruder.temperature %}
        {% elif TARGET_TEMP_OVR|int > 0 %}
            {% set target_temp = TARGET_TEMP_OVR|int %}
        {% else %}
            {% set target_temp = [first_layer_temp|default(220) - nozzle_temp_pad, nozzle_temp_limit]|min %}
        {% endif %}

        {% set current_temp = printer.extruder.temperature %}
        M104 S{target_temp}

        {% if console_output == "ON" %}
            RESPOND PREFIX="SERVO_WIPER: Heating to {target_temp}C"
        {% endif %}

        {% if fixed_mode %}
            # FIXED MOUNT: Drop bed for clearance
            G90
            G1 Z{bed_target_z} F1500
            M400
            {% if console_output == "ON" %}
                RESPOND PREFIX="SERVO_WIPER: Bed dropped to Z:{bed_target_z} for clearance (from Z:{starting_z})"
            {% endif %}

            # 1. Move to poop location (if enabled) for safe servo deployment (only if servo used)
            {% if poop_location_enable|upper == "ON" %}
                G1 X{poop_x} Y{poop_y} F6000
                M400
                {% if console_output == "ON" %}
                    RESPOND PREFIX="SERVO_WIPER: Moved to poop location ({poop_x}, {poop_y}) for servo deploy"
                {% endif %}
            {% endif %}

            # 2. Deploy servo (only if enabled)
            {% if use_servo %}
                SET_SERVO SERVO=servo_wipe ANGLE={servo_deploy_angle}
                G4 P550
                M400

                # PAUSE after servo deploy before moving to brush
                {% if fixed_servo_pause > 0 %}
                    G4 P{fixed_servo_pause}
                    M400
                    {% if console_output == "ON" %}
                        RESPOND PREFIX="SERVO_WIPER: Paused {fixed_servo_pause}ms after servo deploy"
                    {% endif %}
                {% endif %}
            {% else %}
                {% if console_output == "ON" %}
                    RESPOND PREFIX="SERVO_WIPER: Servo disabled, skipping deploy"
                {% endif %}
            {% endif %}

            # 3. Move to brush XY position (with servo deployed or not – brush assumed fixed)
            G1 X{start_x} Y{start_y} F6000
            M400
            {% if console_output == "ON" %}
                RESPOND PREFIX="SERVO_WIPER: Moved to brush XY ({start_x}, {start_y})"
            {% endif %}

            # 4. Heat nozzle after reaching brush
            {% if hot_wipe == "ON" and current_temp < target_temp %}
                M109 S{target_temp}
            {% endif %}

        {% else %}
            # BED MOUNT: Deploy brush FIRST, then move bed up to brush
            G90

            # Move to safe Z first
            {% set safe_z = [printer.toolhead.position.z + drop_distance, limit_z - bot_clearance]|min %}
            G1 Z{safe_z} F1500
            M400

            # Move to brush XY position (at safe Z)
            G1 X{start_x} Y{start_y} F6000
            M400

            # Deploy brush (only if servo enabled)
            {% if use_servo %}
                SET_SERVO SERVO=servo_wipe ANGLE={servo_deploy_angle}
                G4 P550
                M400
            {% else %}
                {% if console_output == "ON" %}
                    RESPOND PREFIX="SERVO_WIPER: Servo disabled, skipping deploy"
                {% endif %}
            {% endif %}

            {% if console_output == "ON" %}
                RESPOND PREFIX="SERVO_WIPER: Brush deployed, now moving bed up to Z:{bed_target_z}"
            {% endif %}

            # Now move bed up to brush height for wiping
            G1 Z{bed_target_z} F1000
            M400

            # Heating in BED mode (after brush deployed and bed up)
            {% if hot_wipe == "ON" and current_temp < target_temp %}
                M109 S{target_temp}
            {% endif %}

        {% endif %}

        # Optional extrude/retract
        {% if extrude_amount not in ["OFF", 0] and hot_wipe != "OFF" %}
            G1 E{extrude_amount} F300
        {% endif %}
        {% if retract_amount not in ["OFF", 0] and hot_wipe != "OFF" %}
            G1 E-{retract_amount} F300
        {% endif %}

        # Fan control (with override)
        {% if FAN_SPEED_OVR >= 0 %}
            M106 S{FAN_SPEED_OVR}
        {% else %}
            M106 S255
        {% endif %}

        # Do NOT turn off extruder yet if KEEP_TEMP is set
        {% if KEEP_TEMP != 1 %}
            M104 S0
        {% endif %}

        {% if console_output == "ON" %}
            RESPOND PREFIX="SERVO_WIPER: Wiping {wipe_pattern} {wipe_dir_upper} {travel_dir_upper} x{wipe_qty}"
        {% endif %}

        # Wipe sequence
        {% for i in range(wipe_qty) %}
            {% if wipe_pattern == "ZIGZAG" %}
                _WIPE_ZIGZAG X={start_x|float} Y={start_y|float} LEN={brush_length|float} SPD={speed|int} DIR={wipe_dir_upper} TRAVEL={travel_dir_upper}
            {% elif wipe_pattern == "STRAIGHT" %}
                _WIPE_STRAIGHT X={start_x|float} Y={start_y|float} LEN={brush_length|float} SPD={speed|int} DIR={wipe_dir_upper} TRAVEL={travel_dir_upper}
            {% endif %}
        {% endfor %}

        {% if ensure_cooling == "ON" and hot_wipe != "OFF" %}
            {% if console_output == "ON" %}RESPOND PREFIX="SERVO_WIPER: Cooling..."{% endif %}
            {% for speed_drop in [5000, 4500, 4000, 3000, 2500, 2500, 3000, 3500, 4000, 4500, 5000] %}
                {% if wipe_dir_upper == "X" %}
                    {% if travel_dir_upper == "NORMAL" %}
                        G1 X{end_x} F{speed_drop}
                        G1 X{start_x} F{speed_drop}
                    {% else %}
                        G1 X{end_x} F{speed_drop}
                        G1 X{start_x} F{speed_drop}
                    {% endif %}
                {% else %}
                    {% if travel_dir_upper == "NORMAL" %}
                        G1 Y{end_y} F{speed_drop}
                        G1 Y{start_y} F{speed_drop}
                    {% else %}
                        G1 Y{end_y} F{speed_drop}
                        G1 Y{start_y} F{speed_drop}
                    {% endif %}
                {% endif %}
            {% endfor %}
        {% endif %}

        # ========== PARK AND COOL SEQUENCE (always runs, servo or not) ==========
        {% if console_output == "ON" %}
            RESPOND PREFIX="SERVO_WIPER: Moving to park position 1 for cooling..."
        {% endif %}
        G1 X{heat_pos_x1} Y{heat_pos_y1} F6000
        M400

        {% if console_output == "ON" %}
            RESPOND PREFIX="SERVO_WIPER: Moving to park position 2..."
        {% endif %}
        G1 X{heat_pos_x2} Y{heat_pos_y2} F6000
        M400

        {% if console_output == "ON" %}
            RESPOND PREFIX="SERVO_WIPER: Waiting for nozzle to cool to {cool_target_temp}C..."
        {% endif %}
        M104 S{cool_target_temp}   # Set target temperature (will cool down)
        M109 S{cool_target_temp}   # Wait until temperature drops to target
        G4 P500                    # Short stabilisation pause

        # Turn off extruder after reaching target temp, before final park
        M104 S0
        {% if console_output == "ON" %}
            RESPOND PREFIX="SERVO_WIPER: Extruder turned off."
        {% endif %}

        {% if console_output == "ON" %}
            RESPOND PREFIX="SERVO_WIPER: Moving to final park position..."
        {% endif %}
        G1 X{heat_pos_x3} Y{heat_pos_y3} F6000
        M400
        # ========== END OF PARK AND COOL SEQUENCE ==========

    {% endif %}

    # Retract servo (only if enabled)
    {% if use_servo %}
        SET_SERVO SERVO=servo_wipe ANGLE={servo_retract_angle}
        G4 P550
        M400

        # PAUSE after servo retract before bed return (FIXED mode only)
        {% if fixed_mode and fixed_servo_pause > 0 %}
            G4 P{fixed_servo_pause}
            M400
            {% if console_output == "ON" %}
                RESPOND PREFIX="SERVO_WIPER: Paused {fixed_servo_pause}ms after servo retract"
            {% endif %}
        {% endif %}

        {% if servo_keep_powered > 0 %}
            UPDATE_DELAYED_GCODE ID=disable_servo_delayed DURATION={servo_keep_powered}
            {% if console_output == "ON" %}
                RESPOND PREFIX="SERVO_WIPER: Servo powered for {servo_keep_powered}s"
            {% endif %}
        {% else %}
            SET_SERVO SERVO=servo_wipe WIDTH=0
        {% endif %}
    {% else %}
        {% if console_output == "ON" %}
            RESPOND PREFIX="SERVO_WIPER: Servo disabled, skipping retract and power management"
        {% endif %}
    {% endif %}

    {% if wipe_pattern not in ["OFF", "DISABLED"] %}

        # FIXED MOUNT: Return bed to starting Z AFTER servo retract (or after park if servo disabled)
        {% if fixed_mode %}
            G1 Z{starting_z} F1500
            M400
            {% if console_output == "ON" %}
                RESPOND PREFIX="SERVO_WIPER: Bed returned to Z:{starting_z}"
            {% endif %}
        {% endif %}

        # Preheat or final temperature handling (only if KEEP_TEMP not set)
        {% if KEEP_TEMP != 1 %}
            {% if preheat == "ON" %}
                {% if printer.print_stats.filename is none %}
                    {% if console_output == "ON" %}RESPOND PREFIX="SERVO_WIPER: Preheating..."{% endif %}
                    PREHEAT
                {% else %}
                    M104 S0
                {% endif %}
            {% else %}
                M104 S0
            {% endif %}
            M106 S0
        {% else %}
            # If KEEP_TEMP is set, we leave fans as they were (but ensure they are not left on high)
            {% if FAN_SPEED_OVR == -1 %}
                M106 S0
            {% endif %}
        {% endif %}

    {% endif %}

    {% if console_output == "ON" and not SERVO_ONLY %}
        RESPOND PREFIX="SERVO_WIPER: Complete."
    {% endif %}