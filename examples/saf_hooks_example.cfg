# ============================================================================
# EXAMPLE: ACE Pro lines for your own Simple AF hooks (NOT included by anything)
# ============================================================================
# Simple AF lets you define each hook macro once. If you already have a hooks file
# (for example my_saf_hooks.cfg), add the ACE lines below to the hooks you already
# have. Do not define the same hook twice.
#
# Hook docs: https://pellcorp.github.io/creality-wiki/custom_hooks/
# ============================================================================

# [gcode_macro _SAF_HOMING_START]          # also _SAF_HOMING_END, _SAF_BED_MESH_START, _SAF_START_PRINT_START
# gcode:
#     ZERO_OUT_SERVO                       # servo out of the way (no effect without a servo)

# [gcode_macro _SAF_START_PRINT_END]
# gcode:
#     SFS_ENABLE_ACE_ENCODER               # encoder runout check on once the print starts

# [gcode_macro _SAF_END_PRINT_START]
# gcode:
#     SFS_DISABLE_ACE_ENCODER
#     ZERO_OUT_SERVO
#     {% if printer["output_pin AUTO_UNLOAD"].value %}
#         _UNLOAD_TOOL_PRINT               # put the filament back into the ACE
#     {% endif %}

# [gcode_macro _SAF_ON_CANCEL]
# gcode:
#     SFS_DISABLE_ACE_ENCODER
#     {% if printer["output_pin AUTO_UNLOAD"].value %}
#         _UNLOAD_TOOL_PRINT
#     {% endif %}
#     PARK_FOR_CANCEL

# --- Pause and resume (follows the ACE_Pro switch) ----------------------------
# Simple AF's PAUSE / RESUME stay in charge. These run the ACE steps only while the
# ACE_Pro switch is on; with it off nothing extra happens.
#
# [gcode_macro _SAF_ON_PAUSE]
# gcode:
#     _ACE_ON_PAUSE
#
# [gcode_macro _SAF_ON_RESUME]
# gcode:
#     _ACE_ON_RESUME

# --- Nozzle wipe -------------------------------------------------------------
# Simple AF has its own wipe. To use a WIPE_NOZZLE macro instead (see
# examples/servo_wiper.cfg), define the hook like this. It restores the nozzle
# temperature afterwards because WIPE_NOZZLE may cool the nozzle.
#
# [gcode_macro _SAF_NOZZLE_WIPE]
# gcode:
#     {% set target = printer[printer.toolhead.extruder].target %}
#     WIPE_NOZZLE
#     M109 S{target}

# --- Loading the first tool inside Simple AF's START_PRINT --------------------
# Normally you start the print with MY_START_PRINT TOOL=... (README section 5.1),
# which loads the tool first and then runs START_PRINT. Alternatively, load the tool
# right before the purge line, with the nozzle already hot:
#
# [gcode_macro _SAF_START_PRINT_BEFORE_LINE_PURGE]
# gcode:
#     _SAF_ACE_TOOL_LOAD {rawparams}       # needs TOOL=<n> in your START_PRINT line
