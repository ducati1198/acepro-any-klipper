######################################################################
# Cutter calibration (manual, step by step) - only moves the toolhead
#
#   CUT_CAL_START            re-homes X/Y, moves to the cutter, stops at cut_engage_x
#   CUT_CAL_STEP             pushes the lever 0.5 mm further (STEP=0.2 for finer steps)
#   CUT_CAL_END              backs off to the cutter block position
#
# Watch the lever after each step and note the X value printed in the console:
#   - TOUCH : first step where the lever starts to move
#   - BOTTOM: first step where the lever is fully pressed (blade closed)
# Never steps past cut_full_x, and stops the session if a step would go further.
######################################################################

[gcode_macro CUT_CAL_START]
description: Cutter calibration - home X/Y and stop at the cut start position
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    {% set y = vars.cut_engage_y | float %}
    {% set x0 = vars.cut_engage_x | float %}
    G28 X Y
    G90
    G1 X{ vars.cut_block_x } Y{ vars.cut_block_y } F6000
    G1 X{ x0 } Y{ y } F600
    M400
    SET_GCODE_VARIABLE MACRO=CUT_CAL_STEP VARIABLE=pos VALUE={ x0 }
    RESPOND TYPE=command MSG="CUT_CAL: at X={ '%.2f' % x0 } (cut_engage_x). Run CUT_CAL_STEP and watch the lever. cut_full_x is { vars.cut_full_x }."

[gcode_macro CUT_CAL_STEP]
description: Cutter calibration - push the lever one small step (STEP=mm, default 0.5)
variable_pos: -9999.0
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    {% if pos < -9000 %}
        RESPOND TYPE=error MSG="CUT_CAL: run CUT_CAL_START first."
    {% else %}
        {% set step = params.STEP | default(0.5) | float | abs %}
        {% set step = 0.5 if step <= 0 or step > 2 else step %}
        {% set start = vars.cut_engage_x | float %}
        {% set full = vars.cut_full_x | float %}
        {% set dir = -1 if full < start else 1 %}
        {% set new = pos + dir * step %}
        {% if (dir < 0 and new < full) or (dir > 0 and new > full) %}
            RESPOND TYPE=error MSG="CUT_CAL: next step would pass cut_full_x ({ full }); stopping at X={ '%.2f' % pos }."
        {% else %}
            G90
            G1 X{ '%.2f' % new } F300
            M400
            SET_GCODE_VARIABLE MACRO=CUT_CAL_STEP VARIABLE=pos VALUE={ new }
            RESPOND TYPE=command MSG="CUT_CAL: X={ '%.2f' % new }  ({ '%.1f' % ((start - new) | abs) } mm past cut_engage_x)"
        {% endif %}
    {% endif %}

[gcode_macro CUT_CAL_END]
description: Cutter calibration - back off to the cutter block position
gcode:
    {% set vars = printer["gcode_macro _ACE_VARS"] %}
    G90
    G1 X{ vars.cut_block_x } Y{ vars.cut_block_y } F600
    M400
    SET_GCODE_VARIABLE MACRO=CUT_CAL_STEP VARIABLE=pos VALUE=-9999.0
    RESPOND TYPE=command MSG="CUT_CAL: done. Tell Claude the TOUCH and BOTTOM X values."
