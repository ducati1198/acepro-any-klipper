<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Helvetica,Arial,sans-serif" font-size="14">
<rect width="900" height="430" rx="14" fill="#f4f6fa" stroke="#c9d1de"/>
<text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d2a44">Hardware overview (Creality K1 Max + 2 x ACE Pro)</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#44546f"/></marker></defs>
<g stroke="#44546f" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M190,150 L250,150"/><path d="M430,120 L500,95"/><path d="M430,150 L500,150"/><path d="M430,180 L500,205"/>
<path d="M610,95 L650,95"/><path d="M610,205 L650,205"/>
</g>
<rect x="30" y="110" width="160" height="150" rx="10" fill="#dbe7ff" stroke="#6b8cd8"/>
<text x="110" y="140" text-anchor="middle" font-weight="bold">Raspberry Pi 5</text>
<text x="110" y="162" text-anchor="middle">Kalico / Klipper</text><text x="110" y="182" text-anchor="middle">Moonraker</text>
<text x="110" y="202" text-anchor="middle">Fluidd + KlipperScreen</text><text x="110" y="222" text-anchor="middle">NVMe drive</text>
<rect x="250" y="95" width="180" height="170" rx="10" fill="#fff3d6" stroke="#d9a93a"/>
<text x="340" y="125" text-anchor="middle" font-weight="bold">Waveshare USB HAT+</text>
<text x="340" y="148" text-anchor="middle">PCIe to M.2, 4 USB ports</text>
<text x="340" y="172" text-anchor="middle" fill="#7a5a00">Kernel pinned to 6.12.96</text>
<text x="340" y="192" text-anchor="middle" fill="#7a5a00">(see Troubleshooting)</text>
<rect x="500" y="70" width="110" height="50" rx="8" fill="#e2f5e6" stroke="#4aa361"/><text x="555" y="93" text-anchor="middle" font-weight="bold">ACE Pro 1</text><text x="555" y="111" text-anchor="middle" font-size="12">T0 - T3</text>
<rect x="500" y="125" width="110" height="50" rx="8" fill="#e2f5e6" stroke="#4aa361"/><text x="555" y="148" text-anchor="middle" font-weight="bold">ACE Pro 2</text><text x="555" y="166" text-anchor="middle" font-size="12">T4 - T7</text>
<rect x="500" y="180" width="110" height="50" rx="8" fill="#ece6fa" stroke="#8a6fd0"/><text x="555" y="203" text-anchor="middle" font-weight="bold">Toolhead MCU</text><text x="555" y="220" text-anchor="middle" font-size="12">nozzle sensor</text>
<rect x="250" y="285" width="180" height="50" rx="8" fill="#ece6fa" stroke="#8a6fd0"/><text x="340" y="308" text-anchor="middle" font-weight="bold">Expander board</text><text x="340" y="325" text-anchor="middle" font-size="12">RDM / encoder pins</text>
<path d="M340,265 L340,285" stroke="#44546f" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="650" y="70" width="220" height="50" rx="8" fill="#fff" stroke="#9aa6bd"/><text x="760" y="92" text-anchor="middle" font-weight="bold">PTFE tubes to splitter</text><text x="760" y="110" text-anchor="middle" font-size="12">RDM sensor, then toolhead</text>
<rect x="650" y="180" width="220" height="100" rx="8" fill="#fff" stroke="#9aa6bd"/><text x="760" y="205" text-anchor="middle" font-weight="bold">Back-left of the printer</text>
<text x="760" y="228" text-anchor="middle" font-size="12">Cutter block (X 50 / Y 304)</text><text x="760" y="246" text-anchor="middle" font-size="12">Poop bucket (X 180.5 / Y 303)</text><text x="760" y="264" text-anchor="middle" font-size="12">Servo basket (EZMAX ES3004, PB14)</text>
<text x="450" y="395" text-anchor="middle" fill="#44546f" font-size="13">ACE units, toolhead MCU and expander board all connect to the Pi through the USB HAT.</text>
</svg>
