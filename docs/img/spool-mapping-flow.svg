<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Helvetica,Arial,sans-serif" font-size="14">
<rect width="900" height="360" rx="14" fill="#f4f6fa" stroke="#c9d1de"/>
<text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d2a44">How the spool mapping works</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#44546f"/></marker></defs>
<g stroke="#44546f" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M200,110 L255,110"/><path d="M425,110 L480,110"/><path d="M650,110 L705,110"/>
<path d="M565,150 L565,215"/><path d="M345,150 L345,215"/><path d="M425,250 L480,250"/>
</g>
<rect x="30" y="70" width="170" height="80" rx="10" fill="#ece6fa" stroke="#8a6fd0"/><text x="115" y="98" text-anchor="middle" font-weight="bold">1. OrcaSlicer</text><text x="115" y="118" text-anchor="middle" font-size="12">ACE Spools panel</text><text x="115" y="134" text-anchor="middle" font-size="12">pick a spool per filament</text>
<rect x="255" y="70" width="170" height="80" rx="10" fill="#fff" stroke="#9aa6bd"/><text x="340" y="98" text-anchor="middle" font-weight="bold">2. G-code file</text><text x="340" y="118" text-anchor="middle" font-size="12">gets one line:</text><text x="340" y="134" text-anchor="middle" font-size="11" font-family="monospace">ACE_SET_TOOL_MAP MAP=1:4</text>
<rect x="480" y="70" width="170" height="80" rx="10" fill="#dbe7ff" stroke="#6b8cd8"/><text x="565" y="98" text-anchor="middle" font-weight="bold">3. Fluidd (optional)</text><text x="565" y="118" text-anchor="middle" font-size="12">Print opens</text><text x="565" y="134" text-anchor="middle" font-size="12">"Choose ACE spools"</text>
<rect x="705" y="70" width="170" height="80" rx="10" fill="#fff3d6" stroke="#d9a93a"/><text x="790" y="98" text-anchor="middle" font-weight="bold">Fluidd choice wins</text><text x="790" y="118" text-anchor="middle" font-size="12">KEEP_EXISTING=1 keeps</text><text x="790" y="134" text-anchor="middle" font-size="12">an earlier choice</text>
<rect x="255" y="215" width="170" height="70" rx="10" fill="#e2f5e6" stroke="#4aa361"/><text x="340" y="243" text-anchor="middle" font-weight="bold">4. Printer</text><text x="340" y="263" text-anchor="middle" font-size="12">stores the map for this file</text>
<rect x="480" y="215" width="250" height="70" rx="10" fill="#e2f5e6" stroke="#4aa361"/><text x="605" y="243" text-anchor="middle" font-weight="bold">5. During the print</text><text x="605" y="263" text-anchor="middle" font-size="12">T1 in the file loads slot T4 (and so on)</text>
<text x="450" y="325" text-anchor="middle" fill="#44546f" font-size="13">The map is cleared when the print ends. Endless spool re-points it if a slot is swapped.</text>
</svg>
