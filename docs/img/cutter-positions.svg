<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Helvetica,Arial,sans-serif" font-size="14">
<rect width="900" height="300" rx="14" fill="#f4f6fa" stroke="#c9d1de"/>
<text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d2a44">Cutter positions along X (Y = 304)</text>
<line x1="80" y1="150" x2="820" y2="150" stroke="#44546f" stroke-width="3"/>
<g stroke="#44546f" stroke-width="2">
<line x1="720" y1="135" x2="720" y2="165"/><line x1="590" y1="135" x2="590" y2="165"/><line x1="440" y1="135" x2="440" y2="165"/><line x1="200" y1="135" x2="200" y2="165" stroke="#c0392b"/></g>
<rect x="195" y="100" width="10" height="100" fill="#fbd5d0" stroke="#c0392b" display="none"/>
<text x="720" y="125" text-anchor="middle" font-weight="bold">cut_block_x</text><text x="720" y="188" text-anchor="middle">X 50</text><text x="720" y="206" text-anchor="middle" font-size="12">park at the cutter</text>
<text x="590" y="125" text-anchor="middle" font-weight="bold">cut_engage_x</text><text x="590" y="188" text-anchor="middle">X 43</text><text x="590" y="206" text-anchor="middle" font-size="12">lever starts to move</text>
<text x="440" y="125" text-anchor="middle" font-weight="bold">touch (measure)</text><text x="440" y="188" text-anchor="middle">CUT_CAL_STEP</text><text x="440" y="206" text-anchor="middle" font-size="12">first lever movement</text>
<text x="200" y="125" text-anchor="middle" font-weight="bold" fill="#c0392b">cut_full_x</text><text x="200" y="188" text-anchor="middle" fill="#c0392b" font-weight="bold">X 34</text><text x="200" y="206" text-anchor="middle" font-size="12" fill="#c0392b">blade fully closed - stop here</text>
<path d="M120,235 L120,235" /><text x="110" y="250" text-anchor="start" fill="#c0392b" font-size="13">Past this point the belt can skip teeth.</text>
<text x="450" y="280" text-anchor="middle" fill="#44546f" font-size="13">Lower X = further into the lever. Calibrate with CUT_CAL_START, CUT_CAL_STEP, CUT_CAL_END.</text>
</svg>
